# Pushing a tag vX.Y.Z (it must match the VERSION file) tests, builds and
# publishes a GitHub release: DMG, zip, SHA256SUMS.txt, build provenance
# attestations and notes from CHANGELOG.md.
#
# Running it by hand (Actions → Release → Run workflow) is a dry run: it builds
# the same files and notes as a downloadable artifact and publishes nothing.
#
# Signing and notarization switch on when these repository secrets exist
# (see docs/RELEASING.md); without them the release is ad-hoc signed:
#   MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD   Developer ID Application .p12
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD  notarytool credentials
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the VERSION file ($VERSION)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          SEARCH_LIST="$(security list-keychains -d user | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $SEARCH_LIST
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store the notarization credentials
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials fanpilot-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN"
          echo "NOTARY_PROFILE=fanpilot-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the release files
        run: scripts/release.sh

      - name: Release notes
        run: |
          if [ -n "${NOTARY_PROFILE:-}" ]; then
            scripts/release-notes.sh "$VERSION" --notarized > build/release-notes.md
          else
            scripts/release-notes.sh "$VERSION" > build/release-notes.md
          fi
          cat build/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FanPilot-${{ env.VERSION }}
          path: |
            build/release/
            build/release-notes.md
          retention-days: 30
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FanPilot-${{ env.VERSION }}
          path: dist

      - name: Check the checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=(--verify-tag)
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/FanPilot-$VERSION.dmg" \
            "dist/release/FanPilot-$VERSION.zip" \
            dist/release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "FanPilot $VERSION" \
            --notes-file dist/release-notes.md \
            "${FLAGS[@]}"
